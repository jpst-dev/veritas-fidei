titulo: "A adoração da Santíssima Trindade (Retábulo Landauer)"
autor: "Albrecht Dürer"
data: "1511"
acervo: "Kunsthistorisches Museum, Viena"
alt: "No alto, Deus Pai coroado sustenta a cruz de Cristo, com a pomba do Espírito Santo acima; ao redor, anjos, a Virgem, mártires, profetas, e embaixo papas, reis e fiéis em adoração, sobre uma paisagem."
